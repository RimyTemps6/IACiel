<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Chatbot IA</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#0c0b09; --ink:#ece3cc; --muted:#a89d82;
    --me:#e9dfc4; --me-ink:#14110d; --bot:#1b1812; --line:#3a3326; --err:#e8a08a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(90% 55% at 50% 38%,#1d1911 0%,var(--bg) 72%) fixed;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;justify-content:center}
  .app{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column;background:transparent;
    padding-top:env(safe-area-inset-top,0px)}
  header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
  header h1{font-size:1.05rem;margin:0;font-weight:650}
  #status{font-size:.82rem;color:var(--muted)}
  #status.err{color:var(--err)}
  #msgs{flex:0 0 auto;height:30vh;height:clamp(120px,32dvh,280px);overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
  .m{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
  .m.user{align-self:flex-end;background:var(--me);color:var(--me-ink);border-bottom-right-radius:4px}
  .m.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
  .m.error{align-self:center;color:var(--err);background:transparent;font-size:.9rem;text-align:center}
  .empty{margin:auto;color:var(--muted);text-align:center;max-width:30ch}
  form{display:flex;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
  textarea{flex:1;resize:none;max-height:140px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;
    background:var(--bg);color:var(--ink);font:inherit}
  textarea:focus-visible,button:focus-visible{outline:2px solid var(--me);outline-offset:2px}
  button{padding:0 18px;border:0;border-radius:12px;background:var(--me);color:var(--me-ink);font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:6px 12px;font-size:.82rem;font-weight:500}
  header{flex-wrap:wrap}
  .opts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
  .opts label{display:flex;align-items:center;gap:4px;cursor:pointer}
  textarea{background:#14110d}
  form{position:relative}
  .attach-btn{padding:0 14px;font-size:1.4rem;background:transparent;color:var(--ink);border:1px solid var(--line)}
  .menu{position:absolute;bottom:calc(100% + 6px);left:14px;background:#14110d;border:1px solid var(--line);border-radius:12px;padding:6px;display:none;flex-direction:column;min-width:190px;z-index:5}
  .menu.open{display:flex}
  .menu button{background:transparent;color:var(--ink);text-align:left;padding:10px 12px;font-weight:500;border-radius:8px}
  .menu button:hover{background:#22201a}
  #tray{display:flex;gap:8px;padding:8px 14px 0;overflow-x:auto}
  #tray:empty{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
  .chip img{width:44px;height:44px;object-fit:cover;border-radius:6px}
  .chip b{cursor:pointer;color:var(--ink);font-size:1rem}
  .m img{max-width:150px;border-radius:8px;display:block;margin-bottom:6px}
  .apirow{display:flex;gap:6px;margin-top:4px}
  .apirow select{padding:4px 8px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);font:inherit;font-size:.82rem;max-width:190px}
  .panel{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .panel[hidden]{display:none}
  .sheet{width:100%;max-width:560px;max-height:88dvh;overflow:auto;background:#14110d;border:1px solid var(--line);border-radius:16px 16px 0 0;padding:16px calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 16px}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .sheet h3{margin:16px 0 0;font-size:.95rem}
  .sheet label{display:block;font-size:.8rem;color:var(--muted);margin-top:10px}
  .sheet input,.sheet select{width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
  .row.on{border-color:var(--me)}
  .row .info{flex:1;min-width:0;font-size:.9rem}
  .row .info small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note{font-size:.78rem;color:var(--muted);margin:10px 0 0}
  #aAdd{margin-top:14px;padding:11px 18px;width:100%}
  .m.hidden-text{cursor:pointer;font-style:italic;color:var(--muted)}
  .core{flex:1 1 0;min-height:0;position:relative;background:transparent;overflow:hidden}
  #core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
  @supports (height:100dvh){html,body,.app{height:100dvh}}
  @media (max-width:560px){
    header{padding:8px 12px;gap:6px}
    header h1{font-size:1rem}
    .opts{gap:6px;font-size:.78rem}
    .ghost{padding:5px 9px}
    #msgs{padding:12px}
    form{padding-top:8px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Chatbot IA</h1>
      <div id="status">Conectando ao banco de dados…</div>
      <div class="apirow"><select id="apiSel" aria-label="API em uso" disabled></select><button class="ghost" id="apiBtn" type="button">⚙ APIs</button></div>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="optVoz" checked> Falar</label>
      <label><input type="checkbox" id="optTexto"> Mostrar texto</label>
      <button class="ghost" id="stop" type="button">Parar voz</button>
      <button class="ghost" id="clear" type="button">Nova conversa</button>
    </div>
  </header>
  <div class="core"><canvas id="core" aria-label="Núcleo da Ciel"></canvas></div>
  <div id="msgs"><div class="empty" id="empty">Escreva uma mensagem para começar a conversa.</div></div>
  <div id="tray"></div>
  <form id="f">
    <button class="attach-btn" id="plus" type="button" aria-label="Anexar">+</button>
    <div class="menu" id="menu">
      <button type="button" data-k="cam">📷 Tirar foto</button>
      <button type="button" data-k="img">🖼️ Imagem da galeria</button>
      <button type="button" data-k="file">📎 Arquivo de texto</button>
    </div>
    <input type="file" id="inCam" accept="image/*" capture="environment" hidden>
    <input type="file" id="inImg" accept="image/*" multiple hidden>
    <input type="file" id="inFile" accept=".txt,.md,.csv,.json,.xml,.html,.css,.js,.py,.java,.c,.cpp,.log,text/*" multiple hidden>
    <textarea id="t" rows="1" placeholder="Digite sua mensagem" autocomplete="off"></textarea>
    <button id="send" type="submit" disabled>Enviar</button>
  </form>
</div>

<div class="panel" id="apiPanel" hidden>
  <div class="sheet">
    <div class="sheet-head"><b>APIs da Ciel</b><button class="ghost" id="apiClose" type="button">Fechar</button></div>
    <div id="apiList"></div>
    <h3>Adicionar API</h3>
    <label>Nome <input id="aName" placeholder="Ex.: Minha Groq" autocomplete="off"></label>
    <label>Serviço
      <select id="aPreset">
        <option value="apinex">APInex</option>
        <option value="groq">Groq</option>
        <option value="openrouter">OpenRouter</option>
        <option value="outro">Outro (preencher na mão)</option>
      </select>
    </label>
    <label>Chave da API <input id="aKey" type="password" placeholder="Cole a chave aqui" autocomplete="off"></label>
    <label>Endereço HTTP <input id="aUrl" placeholder="https://.../v1/chat/completions" autocomplete="off"></label>
    <label>Modelo <input id="aModel" placeholder="Nome do modelo" autocomplete="off"></label>
    <label>Modelo para imagens (opcional) <input id="aVision" placeholder="Deixe vazio se não souber" autocomplete="off"></label>
    <div class="note" id="aErr" style="color:var(--err)"></div>
    <button id="aAdd" type="button">Adicionar e usar</button>
    <p class="note">As APIs que você adiciona aqui ficam salvas só neste aparelho e navegador. Se colar só a base do endereço (terminando em /v1), eu completo com /chat/completions.</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== 1) COLE AQUI o firebaseConfig do seu projeto =====
   Firebase Console > Configurações do projeto (engrenagem) > Seus apps > App da Web > Configuração */
const firebaseConfig = {
  apiKey: "AIzaSyCuZLqQ2ysDXGZKW3cv4vdMMtFlWYsgD-U",
  authDomain: "ciel-bbb55.firebaseapp.com",
  projectId: "ciel-bbb55",
  storageBucket: "ciel-bbb55.firebasestorage.app",
  messagingSenderId: "833493328724",
  appId: "1:833493328724:web:b94942b830a06ade1d1ec1"
};

/* ===== 2) Onde a chave da Groq está guardada no Firestore =====
   Coleção: config  |  Documento: groq  |  Campo: apiKey (string)
   Campos opcionais no mesmo documento: model (string), url (string), visionModel (string), system (string) */
const COLLECTION = "config";
const DOCUMENT = "groq";

/* Serviço de IA: troque aqui ou, sem mexer no GitHub, crie os campos "url" e "model" no Firestore (config/groq) */
const DEFAULT_URL = "https://api.apinex.bond/v1/chat/completions";
const DEFAULT_MODEL = "free/deepseek-v4-pro-0813";
/* ===== 3) PERSONALIDADE DA IA — EDITE AQUI =====
   Troque os textos entre aspas. Depois salve o arquivo e envie de novo ao GitHub. */
const PERSONALIDADE = {
  // Nome da IA (aparece no título do site e ela usa para se apresentar)
  nome: "Ciel",

  // Como ela chama VOCÊ em todas as mensagens (ex.: "mestre", "amigo", "chefe", "você")
  chamarUsuarioDe: "Rimy",

  // Seu nome ou apelido (deixe "" se não quiser que ela use)
  nomeDoUsuario: "Rimy",

  // Como ela é: temperamento e jeito de ser
  personalidade: "Sua personalidade sera inteiramente inspirada na CIEL da lightnovel de tensura tensei shitara slime data ken.",

  // Como ela escreve: tom, tamanho das respostas, uso de emojis, gírias
  jeitoDeFalar: "suas respostas seram simples mas completas ela tambem sera zuera podendo fazer piadas e sendo semelhate a Ciel de tensura.",

  // Regras extras (uma por linha, pode adicionar ou apagar linhas)
  regras: [
    "Nunca saia do personagem.",
    "se ela nunca souber da resposta ela dira que ainda não existe nunhuma informacao em seu nucleo ao envez de mentir.",
  ]
};

function montarPrompt(p){
  const linhas = [
    "Seu nome é " + p.nome + ".",
    "Personalidade: " + p.personalidade,
    "Jeito de falar: " + p.jeitoDeFalar,
    'Ao se dirigir à pessoa com quem conversa, chame-a sempre de "' + p.chamarUsuarioDe + '".',
    "Suas respostas serão lidas em voz alta: não use emojis, asteriscos, listas com símbolos nem formatação. Escreva como se estivesse falando."
  ];
  if (p.nomeDoUsuario) linhas.push("O nome da pessoa é " + p.nomeDoUsuario + ".");
  if (p.regras && p.regras.length) linhas.push("Regras:\n- " + p.regras.join("\n- "));
  return linhas.join("\n");
}

/* Se existir o campo "system" no Firestore (config/groq), ele substitui a personalidade acima. */
const DEFAULT_SYSTEM = montarPrompt(PERSONALIDADE);
document.title = PERSONALIDADE.nome;
document.querySelector("h1").textContent = PERSONALIDADE.nome;

const $ = id => document.getElementById(id);
const msgs = $("msgs"), input = $("t"), sendBtn = $("send"), statusEl = $("status");
let cfg = null;
let history = [];

/* ===== VOZ (usa a voz do próprio aparelho, grátis e sem configuração) ===== */
const optVoz = $("optVoz"), optTexto = $("optTexto");
const canSpeak = "speechSynthesis" in window;
try{
  const v = localStorage.getItem("optVoz"), t = localStorage.getItem("optTexto");
  if (v !== null) optVoz.checked = v === "1";
  if (t !== null) optTexto.checked = t === "1";
}catch(e){}
if (!canSpeak){ optVoz.checked = false; optVoz.disabled = true; optTexto.checked = true; optTexto.disabled = true; }
function savePrefs(){
  try{ localStorage.setItem("optVoz", optVoz.checked ? "1" : "0"); localStorage.setItem("optTexto", optTexto.checked ? "1" : "0"); }catch(e){}
}
function stopSpeaking(){ speakId++; setCore("idle"); if (canSpeak) speechSynthesis.cancel(); }
optVoz.addEventListener("change", () => { if (!optVoz.checked) stopSpeaking(); savePrefs(); });
optTexto.addEventListener("change", savePrefs);
$("stop").addEventListener("click", stopSpeaking);

let voices = [];
if (canSpeak){
  const loadVoices = () => { voices = speechSynthesis.getVoices(); };
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function pickVoice(){
  const br = /pt[-_]?br|por[-_]?bra/i;
  return voices.find(v => br.test(v.lang) && /google|natural|luciana|francisca|maria/i.test(v.name))
      || voices.find(v => br.test(v.lang))
      || voices.find(v => /^(pt|por)/i.test(v.lang)) || null;
}
function cleanForSpeech(t){
  return t.replace(/```[\s\S]*?```/g, " ").replace(/https?:\/\/\S+/g, " link ")
          .replace(/[*_#`>~]/g, "").replace(/\s+/g, " ").trim();
}
function speak(text){
  if (!canSpeak || !optVoz.checked) return;
  speechSynthesis.cancel();
  const id = ++speakId, voice = pickVoice();
  const parts = (cleanForSpeech(text).match(/[^.!?\n]+[.!?]*/g) || []).filter(x => x.trim());
  const run = () => parts.forEach((p, i) => {
    const u = new SpeechSynthesisUtterance(p.trim());
    u.lang = voice ? voice.lang : "pt-BR"; if (voice) u.voice = voice;
    u.onstart = () => { if (id === speakId) setCore("speaking"); };
    u.onboundary = () => { if (id === speakId) bump(.5); };
    const done = () => { if (id === speakId && i === parts.length - 1) setCore("idle"); };
    u.onend = done; u.onerror = done;
    if (id === speakId) speechSynthesis.speak(u);
  });
  setTimeout(run, 80);
  setTimeout(() => { if (id === speakId && core.state === "thinking") setCore("idle"); }, 4000);
}
function reactSilent(answer){
  const id = ++speakId; setCore("speaking");
  setTimeout(() => { if (id === speakId) setCore("idle"); }, Math.min(6000, 800 + answer.length * 30));
}
/* Celulares só liberam o áudio depois de um toque: isso "destrava" a voz ao enviar */
function unlockSpeech(){
  if (!canSpeak || !optVoz.checked) return;
  const u = new SpeechSynthesisUtterance("."); u.volume = 0; speechSynthesis.speak(u);
}
function showAnswer(bubble, answer){
  bubble.dataset.full = answer;
  if (optTexto.checked || !optVoz.checked){ bubble.textContent = answer; return; }
  bubble.textContent = "🔊 Resposta por voz. Toque aqui para ver o texto.";
  bubble.classList.add("hidden-text");
  bubble.onclick = () => { bubble.textContent = bubble.dataset.full; bubble.classList.remove("hidden-text"); bubble.onclick = null; };
}

/* ===== NÚCLEO DA CIEL: anéis girando; reage ao digitar, pensar e falar ===== */
const cv = $("core"), cx = cv.getContext("2d");
let size = 200, dpr = 1, speakId = 0;
const stage = cv.parentElement;
function fit(){
  size = Math.max(120, Math.floor(Math.min(stage.clientWidth, stage.clientHeight)));
  dpr = Math.min(window.devicePixelRatio || 1, size > 360 ? 1.5 : 2);
  cv.style.width = cv.style.height = size + "px";
  cv.width = cv.height = Math.round(size * dpr);
}
fit(); window.addEventListener("resize", fit); window.addEventListener("orientationchange", () => setTimeout(fit, 200));
if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const glyphs = Array.from({length: 12}, () => Array.from({length: 3 + Math.floor(rnd() * 2)}, () => [rnd() * 2 - 1, rnd() * 2 - 1]));
const cities = Array.from({length: 300}, () => ({ lon: rnd() * 6.283, lat: (rnd() - .5) * 2.6, k: rnd() }));
const core = { state: "idle", speed: 1, pulse: 0, t: 0 };
const SPEED = { idle: 1, thinking: 6, speaking: 2.4 };
const CREAM = "233,223,196", INK = "#0c0b09", TAU = 6.2832;
function setCore(s){ core.state = s; }
function bump(v){ core.pulse = Math.min(1, core.pulse + v); }
function band(r0, r1){ cx.beginPath(); cx.arc(0, 0, r1, 0, TAU); cx.arc(0, 0, r0, 0, TAU, true); cx.fill(); }
function render(){
  const s = size * dpr, c = s / 2, R = c * .78, t = core.t, p = core.pulse;
  cx.setTransform(1, 0, 0, 1, c, c); cx.clearRect(-c, -c, s, s); cx.lineCap = "round";
  for (let i = 0; i < 22; i++){            // fumaça ao redor
    const a = i / 22 * TAU + Math.sin(t * .4 + i * 1.7) * .18;
    const len = R * (.10 + .12 * (.5 + .5 * Math.sin(t * .9 + i * 2.3)) + .16 * p), bend = Math.sin(t * .7 + i) * .12;
    cx.strokeStyle = `rgba(${CREAM},${.10 + .22 * p + .06 * Math.sin(t + i)})`; cx.lineWidth = (2 + i % 3) * dpr;
    cx.beginPath(); cx.moveTo(Math.cos(a) * R, Math.sin(a) * R);
    cx.quadraticCurveTo(Math.cos(a + bend) * (R + len * .6), Math.sin(a + bend) * (R + len * .6), Math.cos(a + bend * 1.6) * (R + len), Math.sin(a + bend * 1.6) * (R + len));
    cx.stroke();
  }
  const k = 1 + .035 * p; cx.scale(k, k);
  cx.globalCompositeOperation = "lighter";   // brilho saindo do núcleo
  const g = cx.createRadialGradient(0, 0, 0, 0, 0, c);
  g.addColorStop(0, `rgba(${CREAM},${.10 + .12 * p})`); g.addColorStop(R * .95 / c, `rgba(${CREAM},${.30 + .40 * p})`);
  g.addColorStop(R * 1.25 / c, `rgba(${CREAM},${.10 + .15 * p})`); g.addColorStop(1, `rgba(${CREAM},0)`);
  cx.fillStyle = g; cx.beginPath(); cx.arc(0, 0, c, 0, TAU); cx.fill();
  for (let i = 0; i < 40; i++){
    const a = i / 40 * TAU + t * .03, r0 = R * .98;
    const r1 = Math.min(c * .98, R * (1.12 + .35 * (.5 + .5 * Math.sin(t * 1.3 + i * 2.1)) + .4 * p));
    const rg2 = cx.createLinearGradient(Math.cos(a) * r0, Math.sin(a) * r0, Math.cos(a) * r1, Math.sin(a) * r1);
    rg2.addColorStop(0, `rgba(${CREAM},${.35 + .5 * p})`); rg2.addColorStop(1, `rgba(${CREAM},0)`);
    cx.strokeStyle = rg2; cx.lineWidth = (1 + (i % 4) * .8) * dpr;
    cx.beginPath(); cx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); cx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); cx.stroke();
  }
  cx.globalCompositeOperation = "source-over";
  cx.fillStyle = INK; band(R * .88, R);   // anel externo com marcações
  cx.save(); cx.rotate(t * .05); cx.strokeStyle = `rgba(${CREAM},.75)`; cx.lineWidth = dpr;
  for (let i = 0; i < 120; i++){ cx.rotate(TAU / 120); const L = i % 5 === 0 ? .07 : .035; cx.beginPath(); cx.moveTo(R * .99, 0); cx.lineTo(R * (.99 - L), 0); cx.stroke(); }
  cx.restore();
  cx.save(); cx.rotate(-t * .08);          // faixa clara segmentada
  for (let i = 0; i < 24; i++){
    cx.fillStyle = (i % 3 === 1 || i % 7 === 0) ? INK : `rgb(${CREAM})`;
    cx.beginPath(); cx.arc(0, 0, R * .86, i / 24 * TAU, (i + 1) / 24 * TAU - .01); cx.arc(0, 0, R * .70, (i + 1) / 24 * TAU - .01, i / 24 * TAU, true); cx.fill();
  }
  cx.restore();
  cx.fillStyle = INK; band(R * .50, R * .69);   // anel de runas
  cx.save(); cx.rotate(t * .12); cx.strokeStyle = cx.fillStyle = `rgb(${CREAM})`; cx.lineWidth = 1.6 * dpr; cx.lineJoin = "round";
  glyphs.forEach((gl, i) => {
    cx.save(); cx.rotate(i / 12 * TAU); cx.translate(R * .595, 0); const u = R * .06;
    cx.beginPath(); gl.forEach((q, j) => j ? cx.lineTo(q[0] * u, q[1] * u) : cx.moveTo(q[0] * u, q[1] * u)); cx.stroke();
    gl.forEach(q => { cx.beginPath(); cx.arc(q[0] * u, q[1] * u, 1.4 * dpr, 0, TAU); cx.fill(); }); cx.restore();
  });
  cx.restore();
  cx.save(); cx.rotate(-t * .2); cx.strokeStyle = `rgba(${CREAM},.55)`; cx.lineWidth = R * .05; cx.setLineDash([1.2 * dpr, 1.6 * dpr]);
  cx.beginPath(); cx.arc(0, 0, R * .465, 0, TAU); cx.stroke(); cx.restore(); cx.setLineDash([]);
  const rg = R * .42, gg = cx.createRadialGradient(0, 0, rg * .2, 0, 0, rg);   // globo central
  gg.addColorStop(0, "#14110d"); gg.addColorStop(.8, "#0a0907"); gg.addColorStop(1, `rgba(${CREAM},${.35 + .4 * p})`);
  cx.fillStyle = gg; cx.beginPath(); cx.arc(0, 0, rg, 0, TAU); cx.fill();
  cities.forEach(q => {
    const lo = q.lon + t * .3, z = Math.cos(q.lat) * Math.cos(lo); if (z <= 0) return;
    cx.fillStyle = `rgba(255,232,170,${(.25 + .6 * q.k) * (.5 + .5 * z) * (.7 + .6 * p)})`;
    cx.fillRect(Math.cos(q.lat) * Math.sin(lo) * rg * .94, Math.sin(q.lat) * rg * .94, 1.6 * dpr, 1.6 * dpr);
  });
}
const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? .25 : 1;
let lastT = performance.now();
function frame(now){
  const dt = Math.min((now - lastT) / 1000, .05); lastT = now;
  core.speed += (SPEED[core.state] * calm - core.speed) * Math.min(1, dt * 3);
  core.pulse *= Math.pow(.05, dt);
  if (core.state === "thinking") core.pulse = Math.max(core.pulse, .35 + .15 * Math.sin(now / 180));
  if (core.state === "speaking") core.pulse = Math.max(core.pulse, .35 + .3 * Math.abs(Math.sin(now / 140)));
  core.t += dt * core.speed; try{ render(); }catch(e){} requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ===== VÁRIAS APIs: lista, painel e escolha na hora ===== */
const store = {
  get(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let customApis = store.get("ciel_apis", []);
let activeId = store.get("ciel_active", "firestore");
function allApis(){
  const l = [];
  if (cfg) l.push({ id: "firestore", name: "Padrão (Firestore)", key: cfg.key, url: cfg.url, model: cfg.model, visionModel: cfg.visionModel, builtin: true });
  return l.concat(customApis);
}
function activeApi(){ const l = allApis(); return l.find(a => a.id === activeId) || l[0] || null; }
function chooseApi(id){ activeId = id; store.set("ciel_active", id); refreshApis(); }
function mkBtn(label, fn){ const b = document.createElement("button"); b.type = "button"; b.className = "ghost"; b.textContent = label; b.onclick = fn; return b; }
function refreshApis(){
  const l = allApis(), a = activeApi(), sel = $("apiSel"), box = $("apiList");
  sel.textContent = ""; box.textContent = "";
  l.forEach(x => { const o = document.createElement("option"); o.value = x.id; o.textContent = x.name; sel.append(o); });
  if (a) sel.value = a.id;
  sel.disabled = !l.length;
  l.forEach(x => {
    const r = document.createElement("div"); r.className = "row" + (a && a.id === x.id ? " on" : "");
    const info = document.createElement("div"); info.className = "info";
    const t = document.createElement("div"); t.textContent = x.name;
    const s = document.createElement("small"); s.textContent = x.model + " · " + x.url.replace(/^https?:\/\//, "") + " · chave ••••" + String(x.key).slice(-4);
    info.append(t, s); r.append(info);
    r.append(mkBtn(a && a.id === x.id ? "Em uso" : "Usar", () => chooseApi(x.id)));
    if (!x.builtin) r.append(mkBtn("Excluir", () => {
      if (!confirm("Excluir " + x.name + "?")) return;
      customApis = customApis.filter(c => c.id !== x.id); store.set("ciel_apis", customApis); refreshApis();
    }));
    box.append(r);
  });
  sendBtn.disabled = !a;
  if (a) setStatus("Pronto · " + a.name + " · modelo " + a.model);
}
const PRESETS = {
  apinex: { url: "https://api.apinex.bond/v1/chat/completions", model: "free/deepseek-v4-pro-0813" },
  groq: { url: "https://api.groq.com/openai/v1/chat/completions", model: "openai/gpt-oss-120b" },
  openrouter: { url: "https://openrouter.ai/api/v1/chat/completions", model: "" },
  outro: { url: "", model: "" }
};
function applyPreset(){ const p = PRESETS[$("aPreset").value]; $("aUrl").value = p.url; $("aModel").value = p.model; }
$("aPreset").addEventListener("change", applyPreset); applyPreset();
$("apiBtn").addEventListener("click", () => { $("apiPanel").hidden = false; });
$("apiClose").addEventListener("click", () => { $("apiPanel").hidden = true; });
$("apiPanel").addEventListener("click", e => { if (e.target.id === "apiPanel") e.target.hidden = true; });
$("apiSel").addEventListener("change", e => chooseApi(e.target.value));
$("aAdd").addEventListener("click", () => {
  const key = $("aKey").value.trim(), model = $("aModel").value.trim(), err = $("aErr");
  let url = $("aUrl").value.trim();
  if (!key || !url || !model){ err.textContent = "Preencha a chave, o endereço e o modelo."; return; }
  if (!/^https:\/\//i.test(url)){ err.textContent = "O endereço precisa começar com https://"; return; }
  if (!/chat\/completions\/?$/i.test(url)) url = url.replace(/\/+$/, "") + "/chat/completions";
  const id = "c" + Date.now();
  customApis.push({ id, name: $("aName").value.trim() || "API " + (customApis.length + 1), key, url, model, visionModel: $("aVision").value.trim() });
  store.set("ciel_apis", customApis);
  ["aName", "aKey", "aVision"].forEach(i => $(i).value = ""); err.textContent = ""; applyPreset();
  chooseApi(id);
});

function setStatus(text, isErr){ statusEl.textContent = text; statusEl.classList.toggle("err", !!isErr); }

function add(role, text){
  const e = $("empty"); if (e) e.remove();
  const d = document.createElement("div");
  d.className = "m " + role;
  d.textContent = text;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}

async function loadConfig(){
  try{
    const db = getFirestore(initializeApp(firebaseConfig));
    const snap = await getDoc(doc(db, COLLECTION, DOCUMENT));
    if (!snap.exists()) throw new Error("Documento " + COLLECTION + "/" + DOCUMENT + " não existe no Firestore.");
    const data = snap.data();
    if (!data.apiKey) throw new Error("O documento não tem o campo apiKey.");
    cfg = { key: data.apiKey, url: data.url || DEFAULT_URL, visionModel: data.visionModel || "", model: data.model || DEFAULT_MODEL, system: data.system || DEFAULT_SYSTEM };
    refreshApis();
  }catch(err){
    console.error(err);
    const denied = /permission|insufficient/i.test(err.message);
    setStatus(denied ? "Sem permissão: confira as regras do Firestore." : "Erro: " + err.message, true);
    refreshApis();
  }
}

/* ===== INFORMAÇÕES EM TEMPO REAL (data/hora e clima, grátis e sem chave) ===== */
const WMO = c => c === 0 ? "céu limpo" : c <= 3 ? "parcialmente nublado" : c <= 48 ? "neblina" : c <= 57 ? "garoa" : c <= 67 ? "chuva" : c <= 77 ? "neve" : c <= 82 ? "pancadas de chuva" : "tempestade";
function getPosition(){
  return new Promise((ok, no) => {
    if (!navigator.geolocation) return no(new Error("localização indisponível"));
    navigator.geolocation.getCurrentPosition(r => ok({ lat: r.coords.latitude, lon: r.coords.longitude, nome: "a localização do usuário" }), () => no(new Error("o usuário não liberou a localização")), { timeout: 8000, maximumAge: 600000 });
  });
}
async function findCity(text){
  const m = text.match(/\b(?:em|de|para|pra|na|no)\s+([A-ZÀ-Ú][\wÀ-ú]+(?:\s+(?:de|da|do)?\s*[A-ZÀ-Ú][\wÀ-ú]+)*)/);
  if (!m) return null;
  const r = await (await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=pt&name=" + encodeURIComponent(m[1]))).json();
  const x = r.results && r.results[0];
  return x ? { lat: x.latitude, lon: x.longitude, nome: x.name + (x.admin1 ? ", " + x.admin1 : "") } : null;
}
async function weather(text){
  const pos = (await findCity(text)) || (await getPosition());
  const u = "https://api.open-meteo.com/v1/forecast?latitude=" + pos.lat + "&longitude=" + pos.lon +
    "&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=3";
  const d = await (await fetch(u)).json(), c = d.current, dy = d.daily;
  const dias = dy.time.map((t, i) => t + ": " + WMO(dy.weather_code[i]) + ", mín " + dy.temperature_2m_min[i] + "°C, máx " + dy.temperature_2m_max[i] + "°C, chance de chuva " + dy.precipitation_probability_max[i] + "%").join("; ");
  return "Clima real agora em " + pos.nome + ": " + WMO(c.weather_code) + ", " + c.temperature_2m + "°C (sensação " + c.apparent_temperature + "°C), umidade " + c.relative_humidity_2m + "%, vento " + c.wind_speed_10m + " km/h. Próximos dias: " + dias + ".";
}
async function liveContext(text){
  const partes = ["Data e hora atuais: " + new Date().toLocaleString("pt-BR", { dateStyle: "full", timeStyle: "short" }) + "."];
  if (/clima|temperatura|chuv|previs[aã]o|calor|frio|tempo (hoje|agora|amanh)|vai (chover|fazer)/i.test(text)){
    try{ partes.push(await weather(text)); }
    catch(e){ partes.push("Não foi possível consultar o clima (" + e.message + "). Peça ao usuário para dizer a cidade, com a inicial maiúscula."); }
  }
  return partes.join("\n");
}

/* ===== ANEXOS: foto, imagem e arquivo de texto ===== */
const tray = $("tray"), menu = $("menu");
let pending = [];
$("plus").addEventListener("click", e => { e.stopPropagation(); menu.classList.toggle("open"); });
document.addEventListener("click", () => menu.classList.remove("open"));
menu.addEventListener("click", e => { const k = e.target.dataset && e.target.dataset.k; if (k) $({ cam: "inCam", img: "inImg", file: "inFile" }[k]).click(); });
function resizeImage(file){
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const s = Math.min(1, 1024 / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", .8));
    };
    im.onerror = () => { URL.revokeObjectURL(url); no(new Error("imagem inválida")); };
    im.src = url;
  });
}
function drawTray(){
  tray.textContent = "";
  pending.forEach((f, i) => {
    const chip = document.createElement("div"); chip.className = "chip";
    if (f.kind === "img"){ const im = new Image(); im.src = f.dataUrl; chip.append(im); } else chip.append("📎");
    const nm = document.createElement("span"); nm.textContent = f.name.length > 18 ? f.name.slice(0, 16) + "…" : f.name; chip.append(nm);
    const x = document.createElement("b"); x.textContent = "×"; x.onclick = () => { pending.splice(i, 1); drawTray(); }; chip.append(x);
    tray.append(chip);
  });
}
async function addFiles(list, kind){
  for (const f of list){
    try{
      if (kind === "img") pending.push({ kind, name: f.name || "foto", dataUrl: await resizeImage(f) });
      else {
        if (f.size > 200000) throw new Error(f.name + " é grande demais (máximo 200 KB)");
        pending.push({ kind, name: f.name, text: (await f.text()).slice(0, 60000) });
      }
    }catch(e){ add("error", "Não foi possível anexar: " + e.message); }
  }
  drawTray();
}
[["inCam", "img"], ["inImg", "img"], ["inFile", "file"]].forEach(([id, kind]) =>
  $(id).addEventListener("change", e => { addFiles([...e.target.files], kind); e.target.value = ""; }));
function trimImages(arr){
  return arr.map((m, i) => (Array.isArray(m.content) && i < arr.length - 1)
    ? { role: m.role, content: m.content.filter(x => x.type === "text").map(x => x.text).join("\n") + "\n[imagem enviada anteriormente]" } : m);
}

async function ask(){
  const text = input.value.trim();
  const api = activeApi();
  if ((!text && !pending.length) || !api) return;
  unlockSpeech(); setCore("thinking");
  input.value = ""; input.style.height = "auto";
  const files = pending; pending = []; drawTray();
  const imgs = files.filter(f => f.kind === "img"), docs = files.filter(f => f.kind === "file");
  let body = text || (imgs.length ? "Descreva esta imagem." : "Leia o arquivo anexado.");
  docs.forEach(d => { body += "\n\n[Arquivo anexado: " + d.name + "]\n" + d.text; });
  const content = imgs.length ? [{ type: "text", text: body }, ...imgs.map(i => ({ type: "image_url", image_url: { url: i.dataUrl } }))] : body;
  const ub = add("user", text);
  imgs.forEach(i => { const im = new Image(); im.src = i.dataUrl; ub.prepend(im); });
  docs.forEach(d => ub.append("\n📎 " + d.name));
  history.push({ role: "user", content });
  sendBtn.disabled = true;
  const bubble = add("bot", "…");
  try{
    const live = await liveContext(text);
    const res = await fetch(api.url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + api.key },
      body: JSON.stringify({
        model: (imgs.length && api.visionModel) ? api.visionModel : api.model,
        messages: [{ role: "system", content: (cfg && cfg.system || DEFAULT_SYSTEM) + "\n\nInformações em tempo real (use quando fizer sentido e nunca invente dados):\n" + live }, ...trimImages(history.slice(-20))]
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data?.error?.message || ("Erro " + res.status));
    const answer = data.choices?.[0]?.message?.content || "(sem resposta)";
    history.push({ role: "assistant", content: answer });
    showAnswer(bubble, answer);
    if (canSpeak && optVoz.checked) speak(answer); else reactSilent(answer);
  }catch(err){
    bubble.remove(); setCore("idle");
    history.pop();
    add("error", "Não foi possível obter a resposta: " + err.message);
  }finally{
    sendBtn.disabled = false;
    msgs.scrollTop = msgs.scrollHeight;
    input.focus();
  }
}

$("f").addEventListener("submit", e => { e.preventDefault(); ask(); });
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ask(); }
});
input.addEventListener("input", () => {
  bump(.25);
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});
$("clear").addEventListener("click", () => {
  stopSpeaking();
  history = [];
  msgs.innerHTML = '<div class="empty" id="empty">Escreva uma mensagem para começar a conversa.</div>';
});

loadConfig();
</script>
